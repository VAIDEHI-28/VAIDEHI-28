<svg width="360" height="72" viewBox="0 0 360 72" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="workGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#7C7CFF"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Animated system orbit -->
  <g transform="translate(35 34)" filter="url(#glow)">

    <!-- Orbit -->
    <ellipse cx="0" cy="0" rx="27" ry="13"
             fill="none" stroke="url(#workGlow)"
             stroke-width="1.6" opacity=".35"
             transform="rotate(-25)">
      <animate attributeName="opacity"
               values=".15;.45;.15"
               dur="2.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Central AI node -->
    <circle cx="0" cy="0" r="8"
            fill="#0d1117"
            stroke="url(#workGlow)"
            stroke-width="2.5">
      <animate attributeName="r"
               values="7;9;7"
               dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="4"
          text-anchor="middle"
          fill="#E6EDF3"
          font-family="Arial, Helvetica, sans-serif"
          font-size="8"
          font-weight="700">AI</text>

    <!-- Orbiting nodes -->
    <circle cx="-24" cy="-10" r="3.5" fill="#00D9FF">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0"
                        to="360 0 0"
                        dur="3.5s"
                        repeatCount="indefinite"/>
    </circle>

    <circle cx="24" cy="-10" r="3.5" fill="#8B6CFF">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0"
                        to="360 0 0"
                        dur="3.5s"
                        repeatCount="indefinite"/>
    </circle>

    <circle cx="20" cy="13" r="3.5" fill="#54D6C4">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0"
                        to="360 0 0"
                        dur="3.5s"
                        repeatCount="indefinite"/>
    </circle>

    <!-- Build / Evaluate / Secure signals -->
    <g opacity="0">
      <text x="-25" y="-20" text-anchor="middle"
            fill="#00D9FF" font-family="Arial" font-size="7">BUILD</text>
      <animate attributeName="opacity"
               values="0;1;1;0"
               keyTimes="0;.08;.25;.33"
               dur="4.5s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="28" y="-20" text-anchor="middle"
            fill="#9B6CFF" font-family="Arial" font-size="7">EVAL</text>
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;.30;.38;.58;.65"
               dur="4.5s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="30" y="25" text-anchor="middle"
            fill="#54D6C4" font-family="Arial" font-size="7">SECURE</text>
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;.62;.70;.92;1"
               dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Animated connecting line -->
  <path d="M73 48 H92"
        stroke="url(#workGlow)"
        stroke-width="2"
        stroke-linecap="round">
    <animate attributeName="stroke-dasharray"
             values="0 30;30 0;0 30"
             dur="2.2s"
             repeatCount="indefinite"/>
  </path>

  <!-- Heading -->
  <text x="103" y="43"
        fill="#E6EDF3"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="600">
    What I Work On
  </text>

  <!-- Blinking cursor -->
  <rect x="278" y="20" width="2" height="27"
        rx="1" fill="#00D9FF">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.1s"
             repeatCount="indefinite"/>
  </rect>

</svg>