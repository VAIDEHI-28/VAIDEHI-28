<svg width="270" height="65" viewBox="0 0 270 65" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B7CFF"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Animated About Me icon -->
  <g transform="translate(8 7)" filter="url(#softGlow)">

    <!-- PERSON: who I am -->
    <g opacity="0">
      <circle cx="30" cy="16" r="7" fill="none" stroke="url(#aboutGlow)" stroke-width="3"/>
      <path d="M16 40 C17 29, 23 25, 30 25 C37 25, 43 29, 44 40"
            fill="none" stroke="url(#aboutGlow)" stroke-width="3"
            stroke-linecap="round"/>
      <animate attributeName="opacity"
        values="1;1;0;0"
        keyTimes="0;0.23;0.28;1"
        dur="4.8s" repeatCount="indefinite"/>
    </g>

    <!-- CODE: what I build -->
    <g opacity="0">
      <path d="M23 12 L10 24.5 L23 37"
            fill="none" stroke="url(#aboutGlow)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 12 L50 24.5 L37 37"
            fill="none" stroke="url(#aboutGlow)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 9 L26 40"
            fill="none" stroke="url(#aboutGlow)" stroke-width="3"
            stroke-linecap="round"/>
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.23;0.28;0.50;0.55;1"
        dur="4.8s" repeatCount="indefinite"/>
    </g>

    <!-- NEURAL NETWORK: what I explore -->
    <g opacity="0">
      <line x1="17" y1="15" x2="30" y2="24" stroke="url(#aboutGlow)" stroke-width="2"/>
      <line x1="43" y1="15" x2="30" y2="24" stroke="url(#aboutGlow)" stroke-width="2"/>
      <line x1="17" y1="34" x2="30" y2="24" stroke="url(#aboutGlow)" stroke-width="2"/>
      <line x1="43" y1="34" x2="30" y2="24" stroke="url(#aboutGlow)" stroke-width="2"/>
      <circle cx="17" cy="15" r="5" fill="#0d1117" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="43" cy="15" r="5" fill="#0d1117" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="17" cy="34" r="5" fill="#0d1117" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="43" cy="34" r="5" fill="#0d1117" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="30" cy="24" r="6" fill="#0d1117" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.50;0.55;0.73;0.78;1"
        dur="4.8s" repeatCount="indefinite"/>
    </g>

    <!-- TARGET: where I'm going -->
    <g opacity="0">
      <circle cx="30" cy="24" r="16" fill="none" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="30" cy="24" r="9" fill="none" stroke="url(#aboutGlow)" stroke-width="2.5"/>
      <circle cx="30" cy="24" r="3.5" fill="url(#aboutGlow)"/>
      <path d="M30 5 V10 M30 38 V43 M11 24 H6 M49 24 H54"
            stroke="url(#aboutGlow)" stroke-width="2.5" stroke-linecap="round"/>
      <animate attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.73;0.78;0.95;1;1"
        dur="4.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Heading -->
  <text x="78" y="42"
        fill="#E6EDF3"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="600">
    About Me
  </text>
</svg>