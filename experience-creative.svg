<svg width="390" height="86" viewBox="0 0 390 86" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="5" y1="5" x2="62" y2="62" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9"/>
    <stop offset="0.55" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Creative career timeline / experience icon -->
<g transform="translate(10 10)">
  <!-- vertical timeline -->
  <path d="M27 8V58" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- moving timeline pulse -->
  <circle cx="27" cy="8" r="3" fill="#67E8F9" filter="url(#glow)">
    <animate attributeName="cy" values="8;58;8" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- milestones -->
  <circle cx="27" cy="18" r="5" fill="#0F172A" stroke="url(#g)" stroke-width="2"/>
  <circle cx="27" cy="38" r="5" fill="#0F172A" stroke="url(#g)" stroke-width="2"/>
  <circle cx="27" cy="58" r="5" fill="#0F172A" stroke="url(#g)" stroke-width="2"/>

  <!-- small experience cards -->
  <rect x="39" y="12" width="20" height="12" rx="3" fill="#111827" stroke="#475569"/>
  <rect x="39" y="32" width="25" height="12" rx="3" fill="#111827" stroke="#475569"/>
  <rect x="39" y="52" width="20" height="12" rx="3" fill="#111827" stroke="#475569"/>

  <path d="M43 18H54M43 38H59M43 58H54" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round">
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- subtle floating motion -->
  <animateTransform attributeName="transform" type="translate"
    values="10 10;10 8.5;10 10" dur="3.5s" repeatCount="indefinite"/>
</g>

<!-- heading -->
<text x="94" y="51"
  font-family="Arial, Helvetica, sans-serif"
  font-size="29"
  font-weight="700"
  fill="#FFFFFF">
  Experience
</text>

<!-- subtle cyan accent -->
<rect x="94" y="59" width="92" height="2" rx="1" fill="url(#g)">
  <animate attributeName="width" values="28;92;28" dur="2.6s" repeatCount="indefinite"/>
</rect>
</svg>