<svg width="420" height="300" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">

  <rect x="1" y="1" width="418" height="298" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"></rect>

  <!-- Moving light -->
  <rect x="2" y="2" width="416" height="296" rx="13" fill="none" stroke="#7c9cff" stroke-width="3" stroke-linecap="round" stroke-dasharray="45 1200">
    <animate attributeName="stroke-dashoffset" from="0" to="-1245" dur="3.5s" repeatCount="indefinite"></animate>
  </rect>

  <!-- Accent line -->
  <rect x="35" y="35" width="55" height="3" rx="2" fill="#7c9cff"></rect>

  <!-- Title -->
  <text x="210" y="85" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">
    Build AI
  </text>

  <!-- Technologies -->
  <text x="210" y="135" text-anchor="middle" fill="#a8b3c2" font-family="Arial, Helvetica, sans-serif" font-size="16">
    LLMs • RAG • Agentic AI
  </text>

  <text x="210" y="162" text-anchor="middle" fill="#a8b3c2" font-family="Arial, Helvetica, sans-serif" font-size="16">
    Deep Learning
  </text>

  <!-- Description -->
  <text x="210" y="210" text-anchor="middle" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="14">
    Building practical AI systems
  </text>

  <text x="210" y="234" text-anchor="middle" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="14">
    for real-world problems.
  </text>

</svg>