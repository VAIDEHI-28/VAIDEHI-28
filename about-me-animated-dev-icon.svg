<svg width="285" height="70" viewBox="0 0 285 70" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#6C8CFF"/>
      <stop offset="100%" stop-color="#9B6CFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Small orbiting code particles -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">

    <!-- < -->
    <path d="M11 31 L16 27 L11 23" opacity="0">
      <animate attributeName="opacity"
        values="0;1;1;0" keyTimes="0;.15;.45;.6"
        dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;4 -2;8 0"
        dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- > -->
    <path d="M49 23 L54 27 L49 31" opacity="0">
      <animate attributeName="opacity"
        values="0;1;1;0" keyTimes=".45;.6;.9;1"
        dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="0 0;-4 2;-8 0"
        dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated glow ring -->
  <circle cx="32" cy="28" r="22"
          fill="none"
          stroke="url(#accent)"
          stroke-width="1.5"
          opacity=".18">
    <animate attributeName="r" values="19;25;19"
             dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.35;.08"
             dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 👨‍💻 icon -->
  <g filter="url(#glow)">
    <text x="32" y="40"
          text-anchor="middle"
          font-size="31"
          font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">
      👨‍💻
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -2;0 0;0 1;0 0"
        dur="2.8s"
        repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tiny scanning line -->
  <rect x="9" y="48" width="46" height="1.5"
        rx="1" fill="url(#accent)" opacity=".35">
    <animate attributeName="width"
             values="12;46;12"
             dur="2.8s"
             repeatCount="indefinite"/>
    <animate attributeName="x"
             values="26;9;26"
             dur="2.8s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Heading -->
  <text x="70" y="42"
        fill="#E6EDF3"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="600">
    About Me
  </text>

  <!-- subtle blinking cursor -->
  <rect x="211" y="20" width="2" height="27"
        rx="1" fill="#00D9FF">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.1s"
             repeatCount="indefinite"/>
  </rect>

</svg>