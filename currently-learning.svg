<svg width="420" height="86" viewBox="0 0 420 86" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="8" y1="5" x2="62" y2="65" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Open book / learning icon -->
<g transform="translate(10 10)">
  <!-- book pages -->
  <path d="M5 22C13 18 22 19 30 24V61C22 56 13 55 5 59V22Z"
        fill="#0F172A" stroke="url(#g)" stroke-width="2"/>
  <path d="M30 24C38 19 47 18 55 22V59C47 55 38 56 30 61V24Z"
        fill="#0F172A" stroke="url(#g)" stroke-width="2"/>
  <path d="M30 24V61" stroke="#475569" stroke-width="1.5"/>

  <!-- page lines -->
  <path d="M11 30H23M11 36H24M11 42H21M37 30H49M36 36H49M38 42H47"
        stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>

  <!-- learning spark -->
  <path d="M30 9L32 14L37 16L32 18L30 23L28 18L23 16L28 14L30 9Z"
        fill="#67E8F9" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate"
      values="0 30 16;12 30 16;0 30 16;-12 30 16;0 30 16"
      dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- subtle book breathing -->
  <animateTransform attributeName="transform" type="translate"
    values="10 10;10 8.5;10 10" dur="3.5s" repeatCount="indefinite"/>
</g>

<!-- clean white heading -->
<text x="83" y="51"
      font-family="Arial, Helvetica, sans-serif"
      font-size="28"
      font-weight="700"
      fill="#FFFFFF">
  Currently Learning
</text>
</svg>