<svg width="390" height="86" viewBox="0 0 390 86" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gh" x1="8" y1="5" x2="62" y2="65" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- GitHub analytics icon: contribution grid + activity pulse -->
<g transform="translate(10 11)">
  <!-- subtle GitHub mark silhouette -->
  <path d="M31 5C17 5 6 16 6 30c0 11 7 20 17 23 1 .2 1.5-.5 1.5-1.1v-4.1c-7 1.5-8.5-3-8.5-3-1.2-2.9-2.8-3.7-2.8-3.7-2.3-1.6.2-1.6.2-1.6 2.5.2 3.8 2.6 3.8 2.6 2.3 3.8 6 2.7 7.5 2.1.2-1.6.9-2.7 1.6-3.3-5.6-.6-11.5-2.8-11.5-12.4 0-2.7 1-4.8 2.6-6.5-.3-.6-1.1-3.1.2-6.4 0 0 2.1-.7 6.8 2.5 2-.6 4.1-.9 6.2-.9s4.2.3 6.2.9c4.7-3.2 6.8-2.5 6.8-2.5 1.3 3.3.5 5.8.2 6.4 1.6 1.7 2.6 3.8 2.6 6.5 0 9.6-5.9 11.8-11.5 12.4.9.8 1.7 2.4 1.7 4.8v7.1c0 .6.5 1.3 1.6 1.1C44 50 51 41 51 30 51 16 40 5 31 5Z"
        fill="#111827" stroke="url(#gh)" stroke-width="1.7"/>

  <!-- contribution cells -->
  <g transform="translate(58 9)">
    <g fill="#334155">
      <rect x="0" y="0" width="5" height="5" rx="1"/>
      <rect x="8" y="0" width="5" height="5" rx="1"/>
      <rect x="16" y="0" width="5" height="5" rx="1"/>
      <rect x="24" y="0" width="5" height="5" rx="1"/>
      <rect x="0" y="8" width="5" height="5" rx="1"/>
      <rect x="8" y="8" width="5" height="5" rx="1"/>
      <rect x="16" y="8" width="5" height="5" rx="1"/>
      <rect x="24" y="8" width="5" height="5" rx="1"/>
      <rect x="0" y="16" width="5" height="5" rx="1"/>
      <rect x="8" y="16" width="5" height="5" rx="1"/>
      <rect x="16" y="16" width="5" height="5" rx="1"/>
      <rect x="24" y="16" width="5" height="5" rx="1"/>
      <rect x="0" y="24" width="5" height="5" rx="1"/>
      <rect x="8" y="24" width="5" height="5" rx="1"/>
      <rect x="16" y="24" width="5" height="5" rx="1"/>
      <rect x="24" y="24" width="5" height="5" rx="1"/>
    </g>
    <rect x="8" y="8" width="5" height="5" rx="1" fill="#67E8F9"/>
    <rect x="16" y="16" width="5" height="5" rx="1" fill="#818CF8"/>
    <rect x="24" y="24" width="5" height="5" rx="1" fill="#67E8F9"/>
    <circle cx="2.5" cy="2.5" r="2" fill="#67E8F9" filter="url(#glow)">
      <animate attributeName="cx" values="2.5;10.5;18.5;26.5;2.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="2.5;10.5;18.5;26.5;2.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <animateTransform attributeName="transform" type="translate"
    values="10 11;10 9.5;10 11" dur="3.5s" repeatCount="indefinite"/>
</g>

<!-- heading -->
<text x="132" y="52" font-family="Arial, Helvetica, sans-serif"
      font-size="28" font-weight="700" fill="#FFFFFF">
  GitHub Analytics
</text>

</svg>