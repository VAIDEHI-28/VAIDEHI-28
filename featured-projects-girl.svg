<svg width="430" height="92" viewBox="0 0 430 92" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Animated girl + laptop illustration -->
<g transform="translate(8 5)">
  <!-- laptop -->
  <rect x="12" y="42" width="67" height="34" rx="3" fill="#111827" stroke="#64748B" stroke-width="1.5"/>
  <rect x="17" y="47" width="57" height="24" rx="1.5" fill="#0F172A" stroke="url(#screen)" stroke-width="1"/>
  <path d="M5 78H86L80 83H11L5 78Z" fill="#334155"/>

  <!-- screen activity -->
  <path d="M25 57H44M25 62H55M25 67H39" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="65" cy="59" r="3" fill="#818CF8" filter="url(#glow)">
    <animate attributeName="cy" values="58;63;58" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- girl head -->
  <circle cx="51" cy="17" r="10" fill="#D6A27A"/>
  <!-- hair -->
  <path d="M41 18C39 8 46 3 53 4C61 5 65 11 62 20C60 14 57 12 53 11C50 15 46 17 41 18Z" fill="#1F2937"/>
  <path d="M43 20C39 23 41 31 46 32" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>

  <!-- body -->
  <path d="M43 29C49 26 57 27 62 33L70 45H39L43 29Z" fill="#475569"/>

  <!-- arm typing -->
  <path d="M60 35C66 38 69 43 73 47" stroke="#D6A27A" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      values="0 60 35;3 60 35;0 60 35" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- subtle breathing -->
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
</g>

<!-- Simple white heading -->
<text x="105" y="57"
  font-family="Arial, Helvetica, sans-serif"
  font-size="28"
  font-weight="700"
  fill="#FFFFFF">
  Featured Projects
</text>

<!-- blinking cursor -->
<rect x="354" y="35" width="2" height="27" rx="1" fill="#FFFFFF">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>